# Limites e Quotas para garantir que uma aplicação não monopolize o cluster
apiVersion: v1
kind: ResourceQuota
metadata:
  name: webterminal-quota
  namespace: webterminal
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: webterminal-limit-range
  namespace: webterminal
spec:
  limits:
  - default: # Limite padrão se o container não especificar
      cpu: "1"
      memory: "1Gi"
    defaultRequest: # Request padrão se o container não especificar
      cpu: "200m"
      memory: "256Mi"
    type: Container
